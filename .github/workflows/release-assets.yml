name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-packages:
    name: Linux packages
    uses: ./.github/workflows/arch-package.yml
    with:
      attach_to_release: true
    secrets: inherit
    permissions:
      contents: write

  release-notes:
    name: Finalize release notes after all assets
    runs-on: ubuntu-latest
    needs:
      - linux-packages
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Generate fork notes
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/BigPizzaV3/CodexPlusPlus.git
          git fetch upstream main
          {
            echo
            echo "---"
            echo
            echo '<!-- codexplusplus-fork-notes -->'
            echo
            echo "## 与上游 BigPizzaV3/CodexPlusPlus 的差异"
            echo
            diff_lines="$(git log --no-merges --oneline upstream/main..HEAD)"
            if [[ -n "$diff_lines" ]]; then
              echo '```'
              echo "$diff_lines"
              echo '```'
            else
              echo "无差异"
            fi
            echo
            echo "## 兼容性"
            echo
            cat docs/release/compatibility.md
          } > fork-notes.md
          cat fork-notes.md

      - name: Append fork notes idempotently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: scripts/release/finalize-release.sh fork-notes.md

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs: release-notes
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
