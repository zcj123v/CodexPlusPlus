name: Release assets

# 发版入口是推送 v* tag（本地用 `node scripts/release.mjs <版本号>`）：
#   prepare  校验版本号文件与 tag 一致，从 CHANGELOG.md 截取说明，建草稿 Release
#   构建     Linux DEB / tar.gz 构建，附件传到草稿
#   收尾     生成 SHA256SUMS.txt 与 latest.json，附件齐了才公开发布
# 草稿期间用户看不到这一版，某个平台失败也不会让「检查更新」读到缺附件的 Latest。
# 手动在网页上发布 Release 不再触发构建；补跑某个平台用 workflow_dispatch。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v2.6.10-linux.1"
        required: true
        type: string
      publish:
        description: "Release 还是草稿时，附件与更新元数据齐备后公开发布"
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

# 同一个 tag 的两轮不要并发上传附件。
concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft Release
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.release.outputs.is_draft }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify version files match tag
        # 只拦推 tag 的新发版；补跑旧 tag 时那一版可能还没有这些文件或校验脚本。
        if: github.event_name == 'push'
        run: node scripts/release-meta.mjs check "$RELEASE_TAG"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/release-meta.mjs notes "$RELEASE_TAG" > notes.md; then
            echo "::warning::CHANGELOG.md 里没有 ${RELEASE_TAG#v} 这一节，改用 GitHub 自动生成的说明"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > notes.md
          fi
          cat notes.md

      - name: Create or update draft Release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing)
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "Codex++ $RELEASE_TAG" --notes-file notes.md
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              # 事先手动建好的草稿：推 tag 时以 CHANGELOG 为准刷新说明；补跑时保留手改过的说明。
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --verify-tag --title "Codex++ $RELEASE_TAG" --notes-file notes.md
              fi
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$RELEASE_TAG 已公开发布，说明保持不动，只补附件"
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  linux-deb:
    needs: prepare
    name: Linux DEB (Ubuntu 24.04, amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: linux
          save-if: false

      # 与 pr-build.yml 相同：默认 Azure 镜像不通时限时失败并换官方源重试。
      - name: Install Linux build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pkgs="build-essential curl git pkg-config libssl-dev libsqlite3-dev \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libz3-dev libasound2-dev"
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15"
          try_install() {
            timeout 480 bash -c "$apt update -qq && $apt install -y --no-install-recommends $pkgs"
          }
          # 新版 runner 的源写成 mirror+file:/etc/apt/apt-mirrors.txt（里面是 azure 镜像），旧版直接写 azure 地址，两种都换。
          use_official_mirror() {
            echo "::warning::默认 Ubuntu 镜像不可用，改用 archive.ubuntu.com"
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              if [ -f "$f" ]; then
                sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu#g' \
                  -e 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
              fi
            done
          }
          # 域名都解析不了时 apt 要白等好几分钟才放弃（2026-11-11 实测），先探一下，不通直接换。
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            use_official_mirror
          fi
          if ! try_install; then
            use_official_mirror
            try_install
          fi

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Test frontend
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Check sherpa-onnx prebuilt cache
        run: node scripts/prepare-sherpa-cache.mjs

      - name: Test core library
        run: cargo test --locked -p codex-plus-core --lib

      - name: Build application
        run: cargo build --locked --release -p codex-plus-manager

      - name: Build DEB
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          bash "$GITHUB_WORKSPACE/scripts/installer/linux/build-deb.sh" --package-only

      - name: Verify package and install
        shell: bash
        run: |
          set -euo pipefail
          deb_file="$(find dist/linux -maxdepth 1 -name "*.deb" -print -quit)"
          test -n "$deb_file"
          version="${RELEASE_TAG#[vV]}"
          test "$(dpkg-deb -f "$deb_file" Package)" = "codex-plus-plus"
          test "$(dpkg-deb -f "$deb_file" Version)" = "$version"
          dpkg-deb -c "$deb_file" | grep -F "./usr/bin/codex-plus-plus"
          sudo apt-get install -y "./$deb_file"
          test -x /usr/bin/codex-plus-plus
          dpkg -V codex-plus-plus
          ldd /usr/bin/codex-plus-plus | tee /tmp/codex-plus-plus-ldd.log
          ! grep -q "not found" /tmp/codex-plus-plus-ldd.log
          # 统一成 CodexPlusPlus-<版本>-linux-amd64.deb：SHA256SUMS 按 CodexPlusPlus-* 收录，应用内更新按 .deb + amd64 识别。
          mkdir -p dist/release
          cp "$deb_file" "dist/release/CodexPlusPlus-${version}-linux-amd64.deb"

      - name: Build Linux tar archive
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#[vV]}"
          mkdir -p dist/portable
          dpkg-deb -x "dist/release/CodexPlusPlus-${version}-linux-amd64.deb" dist/portable
          tar -C dist/portable/usr -czf "dist/release/CodexPlusPlus-${version}-linux-amd64.tar.gz" .

      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"

  latest-json:
    name: Upload checksums, latest.json and publish
    if: needs.prepare.result == 'success' && needs.linux-deb.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - linux-deb
    steps:
      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 按 Release 上现有的全部安装包重算，单平台补跑后也是完整清单。
          gh release download "$TAG" --repo "$REPO" --pattern 'CodexPlusPlus-*' --dir assets --clobber
          (cd assets && sha256sum CodexPlusPlus-* | sort -k2 > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$REPO"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const required = [
            "CodexPlusPlus-" + version + "-linux-amd64.deb",
            "CodexPlusPlus-" + version + "-linux-amd64.tar.gz",
            "SHA256SUMS.txt"
          ];
          for (const name of required) {
            if (!(release.assets || []).some((asset) => asset.name === name && asset.size > 0)) {
              throw new Error("发布附件缺失或为空：" + name);
            }
          }
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            // 草稿的 release.url 是临时 untagged 地址，静态元数据必须使用正式 tag 链接。
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish Release
        # Linux 构建、安装核验和元数据全部成功后才公开发布。
        if: needs.prepare.outputs.is_draft == 'true' && (github.event_name == 'push' || inputs.publish) && needs.linux-deb.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 只有版本最新时才标 Latest：补发的旧版本不能抢走 Latest，
          # 否则「检查更新」读 releases/latest/download/latest.json 会回退到旧版。
          published=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName')
          newest=$(printf '%s\n' "$TAG" $published | sed 's/^[vV]//' | sort -V | tail -n 1)
          if [ "$newest" = "${TAG#[vV]}" ]; then
            latest=true
          else
            latest=false
            echo "::notice::已有更新的 v$newest，$TAG 发布但不标 Latest"
          fi
          gh release edit "$TAG" --draft=false --latest="$latest" --verify-tag --repo "$REPO"
